version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: conexa_user
      POSTGRES_PASSWORD: conexa_pass
      POSTGRES_DB: conexa_db
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U conexa_user -d conexa_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
