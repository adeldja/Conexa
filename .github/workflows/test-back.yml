name: Test Backend

on: [push, pull_request]

jobs:
  test-back:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: conexa_user
          POSTGRES_PASSWORD: conexa_pass
          POSTGRES_DB: conexa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: '${{ matrix.node-version }}'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn workspace api prisma generate

      - name: Set test environment
        run: |
          echo "DATABASE_URL=postgresql://conexa_user:conexa_pass@localhost:5432/conexa_test" > apps/api/.env.test
          echo "JWT_SECRET=test-jwt-secret" >> apps/api/.env.test
          echo "NODE_ENV=test" >> apps/api/.env.test

      - name: Run tests
        run: yarn workspace api test
