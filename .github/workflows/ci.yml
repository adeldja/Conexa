name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # Job 1: Installation et cache des dépendances
  setup:
    name: Setup & Cache
    runs-on: ubuntu-latest
    outputs:
      yarn-cache-dir: ${{ steps.yarn-cache-dir-path.outputs.dir }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn dependencies
        uses: actions/cache@v3
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/yarn.lock') }}

  # Job 2: Contrôle qualité - Linting
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore yarn cache
        uses: actions/cache@v3
        with:
          path: ${{ needs.setup.outputs.yarn-cache-dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Restore node_modules
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies (if cache miss)
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Check Prettier formatting
        run: yarn format:check

  # Job 3: Tests Backend
  test-backend:
    name: Test Backend (API)
    runs-on: ubuntu-latest
    needs: setup

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: conexa_user
          POSTGRES_PASSWORD: conexa_pass
          POSTGRES_DB: conexa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore yarn cache
        uses: actions/cache@v3
        with:
          path: ${{ needs.setup.outputs.yarn-cache-dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Restore node_modules
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies (if cache miss)
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn workspace api prisma generate

      - name: Setup test environment
        run: |
          echo "DATABASE_URL=postgresql://conexa_user:conexa_pass@localhost:5432/conexa_test" > apps/api/.env.test
          echo "JWT_SECRET=test-jwt-secret-for-ci" >> apps/api/.env.test
          echo "NODE_ENV=test" >> apps/api/.env.test

      - name: Run API tests
        run: yarn workspace api test

      - name: Upload API coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./apps/api/coverage/lcov.info
          flags: api
          name: api-coverage

  # Job 4: Tests Frontend
  test-frontend:
    name: Test Frontend (Web)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore yarn cache
        uses: actions/cache@v3
        with:
          path: ${{ needs.setup.outputs.yarn-cache-dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Restore node_modules
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies (if cache miss)
        run: yarn install --frozen-lockfile

      - name: Setup test environment
        run: |
          echo "NEXT_PUBLIC_API_URL=http://localhost:3001" > apps/web/.env.test

      - name: Run Web tests
        run: yarn workspace web test

      - name: Upload Web coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./apps/web/coverage/lcov.info
          flags: web
          name: web-coverage

  # Job 5: Build verification
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [setup, lint, test-backend, test-frontend]
    strategy:
      matrix:
        workspace: [api, web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore yarn cache
        uses: actions/cache@v3
        with:
          path: ${{ needs.setup.outputs.yarn-cache-dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Restore node_modules
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies (if cache miss)
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client (for API)
        if: matrix.workspace == 'api'
        run: yarn workspace api prisma generate

      - name: Setup build environment
        run: |
          if [ "${{ matrix.workspace }}" = "web" ]; then
            echo "NEXT_PUBLIC_API_URL=http://localhost:3001" > apps/web/.env.local
          fi

      - name: Build ${{ matrix.workspace }}
        run: yarn workspace ${{ matrix.workspace }} build

  # Job 6: Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore yarn cache
        uses: actions/cache@v3
        with:
          path: ${{ needs.setup.outputs.yarn-cache-dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run security audit
        run: yarn audit --groups dependencies --level moderate
        continue-on-error: true

  # Job 7: Validation finale
  validation:
    name: Validation
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend, build, security]
    if: always()
    steps:
      - name: All checks passed
        if: ${{ needs.lint.result == 'success' && needs.test-backend.result == 'success' && needs.test-frontend.result == 'success' && needs.build.result == 'success' }}
        run: |
          echo "Toutes les vérifications sont passées avec succès !"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Tests Backend: ${{ needs.test-backend.result }}"
          echo "Tests Frontend: ${{ needs.test-frontend.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Security: ${{ needs.security.result }}"

      - name: Some checks failed
        if: ${{ needs.lint.result != 'success' || needs.test-backend.result != 'success' || needs.test-frontend.result != 'success' || needs.build.result != 'success' }}
        run: |
          echo "Certaines vérifications ont échoué :"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Tests Backend: ${{ needs.test-backend.result }}"
          echo "Tests Frontend: ${{ needs.test-frontend.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Security: ${{ needs.security.result }}"
          exit 1
