name: Dependencies Management

on:
  schedule:
    # Exécute tous les lundi à 9h00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Permet l'exécution manuelle

env:
  NODE_VERSION: '20'

jobs:
  # Audit de sécurité hebdomadaire
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: 🔽 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🔒 Run security audit
        run: |
          echo "🔍 Audit de sécurité des dépendances..."
          yarn audit --groups dependencies --level low > security-report.txt || true

          if [ -s security-report.txt ]; then
            echo "⚠️ Vulnérabilités détectées :"
            cat security-report.txt
            echo "::warning::Des vulnérabilités de sécurité ont été détectées dans les dépendances"
          else
            echo "✅ Aucune vulnérabilité critique détectée"
          fi

      - name: 📄 Upload security report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-audit-report
          path: security-report.txt
          retention-days: 30

  # Vérification des dépendances obsolètes
  outdated-dependencies:
    name: 📦 Check Outdated Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: 🔽 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 📦 Check for outdated packages
        run: |
          echo "📊 Vérification des dépendances obsolètes..."
          yarn outdated > outdated-report.txt || true

          if [ -s outdated-report.txt ]; then
            echo "📋 Dépendances obsolètes détectées :"
            cat outdated-report.txt
            echo "::notice::Des mises à jour sont disponibles pour certaines dépendances"
          else
            echo "✅ Toutes les dépendances sont à jour"
          fi

      - name: 📄 Upload outdated report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: outdated-dependencies-report
          path: outdated-report.txt
          retention-days: 30

  # Nettoyage automatique des caches
  cleanup-cache:
    name: 🧹 Cache Cleanup
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4

      - name: 🧹 Clean yarn cache
        run: yarn cache clean

      - name: 🗑️ Clear GitHub Actions cache (si nécessaire)
        run: |
          echo "🗑️ Nettoyage des caches GitHub Actions..."
          # Note: Le nettoyage automatique des caches GitHub Actions nécessite des permissions spéciales
          echo "Les caches seront automatiquement supprimés après 7 jours d'inactivité"

  # Validation des lockfiles
  validate-lockfiles:
    name: 🔐 Validate Lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔐 Validate yarn.lock
        run: |
          echo "🔍 Validation du fichier yarn.lock..."

          # Vérifier que yarn.lock est en phase avec package.json
          yarn install --frozen-lockfile --check-files

          echo "✅ Le fichier yarn.lock est valide et synchronisé"

      - name: 📊 Check for duplicate dependencies
        run: |
          echo "🔍 Recherche de dépendances dupliquées..."
          yarn why --json > dependency-analysis.json || true

          # Analyser les doublons (nécessiterait un script personnalisé)
          echo "📋 Analyse des dépendances terminée"

  # Rapport de santé général
  health-report:
    name: 📋 Health Report
    runs-on: ubuntu-latest
    needs: [security-audit, outdated-dependencies, validate-lockfiles]
    if: always()
    steps:
      - name: 📥 Download reports
        uses: actions/download-artifact@v3
        with:
          path: reports/

      - name: 📋 Generate health summary
        run: |
          echo "# 📋 Rapport de Santé des Dépendances" > health-summary.md
          echo "" >> health-summary.md
          echo "**Date:** $(date)" >> health-summary.md
          echo "**Commit:** ${{ github.sha }}" >> health-summary.md
          echo "" >> health-summary.md

          echo "## 🔒 Audit de Sécurité" >> health-summary.md
          if [ -f "reports/security-audit-report/security-report.txt" ]; then
            if [ -s "reports/security-audit-report/security-report.txt" ]; then
              echo "⚠️ Des vulnérabilités ont été détectées" >> health-summary.md
            else
              echo "✅ Aucune vulnérabilité critique" >> health-summary.md
            fi
          else
            echo "❓ Rapport non disponible" >> health-summary.md
          fi

          echo "" >> health-summary.md
          echo "## 📦 Dépendances Obsolètes" >> health-summary.md
          if [ -f "reports/outdated-dependencies-report/outdated-report.txt" ]; then
            if [ -s "reports/outdated-dependencies-report/outdated-report.txt" ]; then
              echo "📋 Des mises à jour sont disponibles" >> health-summary.md
            else
              echo "✅ Toutes les dépendances sont à jour" >> health-summary.md
            fi
          else
            echo "❓ Rapport non disponible" >> health-summary.md
          fi

          echo "" >> health-summary.md
          echo "## 🔐 Validation des Lockfiles" >> health-summary.md
          echo "Status: ${{ needs.validate-lockfiles.result }}" >> health-summary.md

          cat health-summary.md

      - name: 📄 Upload health summary
        uses: actions/upload-artifact@v3
        with:
          name: health-summary
          path: health-summary.md
          retention-days: 90
